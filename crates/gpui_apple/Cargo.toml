[package]
name = "gpui_apple"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_apple.rs"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block.workspace = true
cocoa.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-video.workspace = true
derive_more.workspace = true
etagere.workspace = true
foreign-types.workspace = true
image.workspace = true
log.workspace = true
metal.workspace = true
# Custom-shader support translates caller-supplied WGSL to MSL at runtime
# (metal_custom_shader.rs). Spelled out rather than inherited from the
# workspace entry so a macOS build does not also compile the HLSL backend that
# entry carries for gpui_windows.
naga = { version = "29.0", features = ["wgsl-in", "msl-out"] }
objc.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
